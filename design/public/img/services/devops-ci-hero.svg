<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="ci-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#003366" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="ci-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.09" />
    </filter>

    <style>
      .ci-card { rx: 10; fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.06)); }
      .ci-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .ci-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748b; }
      .edge-solid { stroke: #0284c7; stroke-width: 2; }
      .tag-bg { rx: 4; fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .edge-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 600; fill: #1e40af; }
      .ci-pill { rx: 6; fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }

      @media (prefers-color-scheme: dark) {
        .ci-card { fill: #1e293b; stroke: #334155; }
        .ci-title { fill: #f8fafc; }
        .ci-sub { fill: #94a3b8; }
        .edge-solid { stroke: #38bdf8; }
        .tag-bg { fill: #1e3a8a; stroke: #3b82f6; }
        .edge-tag { fill: #bfdbfe; }
        .ci-pill { fill: #0f172a; stroke: #334155; }
      }
    </style>
  </defs>

  <!-- Background Frame -->
  <rect width="880" height="340" rx="16" fill="url(#ci-bg-gradient)"/>
  <rect width="878" height="338" x="1" y="1" rx="15" stroke="#cbd5e1" stroke-opacity="0.4" fill="none"/>

  <!-- Top Banner Pill -->
  <g transform="translate(28, 14)">
    <rect width="520" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="15" cy="13" r="5" fill="#10b981"/>
    <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#003366">COMMON DEVOPS CI: LINT ➔ TEST ➔ BUILD ➔ PR-BASED FIREBASE PREVIEWS</text>
  </g>

  <!-- Left Column: Reusable Workflows & Quality Gates -->
  <g transform="translate(30, 48)">
    <rect class="ci-card" width="240" height="278"/>
    <rect x="12" y="10" width="28" height="28" rx="6" fill="#eff6ff"/>
    <!-- Checkmark / Test Icon -->
    <path d="M 19 24 L 24 29 L 33 19" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text class="ci-title" x="46" y="22">Shared CI Pipeline</text>
    <text class="ci-sub" x="46" y="34">bcgov/bcros-common</text>

    <line x1="12" y1="44" x2="228" y2="44" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Step 1: Linting -->
    <g transform="translate(10, 50)">
      <rect class="ci-pill" width="220" height="54"/>
      <rect x="8" y="8" width="6" height="38" rx="3" fill="#2563eb"/>
      <text x="20" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">1. Comprehensive Linting</text>
      <text x="20" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• ESLint &amp; TypeScript checks</text>
      <text x="20" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Spectral OpenAPI 3.0 linter</text>
    </g>

    <!-- Step 2: Automated Testing -->
    <g transform="translate(10, 110)">
      <rect class="ci-pill" width="220" height="60"/>
      <rect x="8" y="8" width="6" height="44" rx="3" fill="#0284c7"/>
      <text x="20" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369a1">2. Automated Tests &amp; A11y</text>
      <text x="20" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Vitest / PyTest unit suites</text>
      <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Playwright + Axe a11y audits</text>
      <text x="20" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#0284c7">Code coverage &amp; regression checks</text>
    </g>

    <!-- Step 3: Buildability Verification -->
    <g transform="translate(10, 176)">
      <rect class="ci-pill" width="220" height="54"/>
      <rect x="8" y="8" width="6" height="38" rx="3" fill="#10b981"/>
      <text x="20" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857">3. Buildability Verification</text>
      <text x="20" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Nuxt production compilation</text>
      <text x="20" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Multi-stage Docker image build</text>
    </g>
  </g>

  <!-- Arrow 1: GitHub Actions -> GCP Cloud Build -->
  <path d="M 270 185 L 315 185" class="edge-solid"/>
  <g transform="translate(272, 165)">
    <rect class="tag-bg" width="42" height="18" x="-2" y="-9"/>
    <text class="edge-tag" x="19" y="4" text-anchor="middle">trigger</text>
  </g>

  <!-- Center Card: Google Cloud Build Engine -->
  <g transform="translate(315, 48)">
    <rect width="270" height="278" rx="12" fill="#003366" filter="url(#ci-shadow)"/>
    
    <!-- Header Box -->
    <rect x="12" y="10" width="246" height="34" rx="6" fill="#002244"/>
    <circle cx="28" cy="27" r="8" fill="#38bdf8"/>
    <!-- Gear/Hammer icon -->
    <path d="M 24 28 L 32 20 M 29 20 L 32 23 M 24 25 L 27 28" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="44" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Google Cloud Build</text>
    <text x="44" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#93c5fd">Regional northamerica-northeast1</text>

    <!-- Block 1: Fast Cached Worker Pools -->
    <g transform="translate(12, 50)">
      <rect width="246" height="64" rx="6" fill="#0f3c6d"/>
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#67e8f9">⚡ PARALLEL WORKER POOLS</text>
      <text x="10" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Scalable GCP build runners</text>
      <text x="10" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Package &amp; Docker layer caching</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#93c5fd">Sub-minute feedback for PR authors</text>
    </g>

    <!-- Block 2: 1Password Test Secrets -->
    <g transform="translate(12, 120)">
      <rect width="246" height="64" rx="6" fill="#0f3c6d"/>
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fde047">🔒 1PASSWORD.CA TEST SECRETS</text>
      <text x="10" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Canadian data sovereignty residency</text>
      <text x="10" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Ephemeral test tokens &amp; fixtures</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#86efac">Zero plaintext credentials in PR</text>
    </g>

    <!-- Block 3: Preview Dispatcher -->
    <g transform="translate(12, 190)">
      <rect width="246" height="76" rx="6" fill="#0369a1"/>
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#e0f2fe">🚀 PREVIEW CHANNEL DISPATCH</text>
      <text x="10" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Builds UI bundle for branch</text>
      <text x="10" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Publishes ephemeral channel</text>
      <text x="10" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#fde047">Auto-comments live URL on PR</text>
    </g>
  </g>

  <!-- Arrow 2: Cloud Build -> Firebase PR Preview -->
  <path d="M 585 185 L 635 185" class="edge-solid"/>
  <g transform="translate(588, 165)">
    <rect class="tag-bg" width="44" height="18" x="-2" y="-9"/>
    <text class="edge-tag" x="20" y="4" text-anchor="middle">preview</text>
  </g>

  <!-- Right Column: Interactive PR-Based Firebase Previews -->
  <g transform="translate(635, 48)">
    <rect class="ci-card" width="215" height="278"/>
    <rect x="12" y="10" width="28" height="28" rx="6" fill="#fffbeb"/>
    <!-- Flame / Browser icon -->
    <path d="M 20 16 C 18 19 16 21 16 24 C 16 26.2 17.8 28 20 28 C 22.2 28 24 26.2 24 24 C 24 21 22 19 20 16 Z" fill="#f59e0b"/>
    <text class="ci-title" x="46" y="22">PR Preview Channel</text>
    <text class="ci-sub" x="46" y="34">Firebase Hosting</text>

    <line x1="12" y1="44" x2="203" y2="44" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Preview Card 1: Interactive Review -->
    <g transform="translate(10, 52)">
      <rect width="195" height="96" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1.2"/>
      <text x="10" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">🌟 Live UI Interaction</text>
      <text x="10" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#78350f">• Full interactive frontend</text>
      <text x="10" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#78350f">• Real-time QA &amp; UX sign-off</text>
      <text x="10" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#78350f">• Shareable with Product Owners</text>
      <text x="10" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#d97706">Zero local checkout required</text>
    </g>

    <!-- Preview Card 2: Ephemeral Lifecycle -->
    <g transform="translate(10, 156)">
      <rect width="195" height="110" rx="8" fill="#f0fdf4" stroke="#dcfce7" stroke-width="1.2"/>
      <text x="10" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#166534">⏱️ Ephemeral Lifecycle</text>
      <text x="10" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532d">• Updates automatically on push</text>
      <text x="10" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532d">• URL: pr-123--app.web.app</text>
      <text x="10" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532d">• Auto-expires after PR merge</text>
      <text x="10" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#15803d">Zero resource or cost leaks</text>
      <text x="10" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#166534">Automated GitHub Bot Comment</text>
    </g>
  </g>
</svg>
