<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="ocm-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="ocm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.09" />
    </filter>

    <style>
      .ocm-card { rx: 10; fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.06)); }
      .ocm-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .ocm-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748b; }
      .edge-solid { stroke: #0284c7; stroke-width: 2; }
      .tag-bg { rx: 4; fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .edge-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 600; fill: #1e40af; }
      .ocm-pill { rx: 6; fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }

      @media (prefers-color-scheme: dark) {
        .ocm-card { fill: #1e293b; stroke: #334155; }
        .ocm-title { fill: #f8fafc; }
        .ocm-sub { fill: #94a3b8; }
        .edge-solid { stroke: #38bdf8; }
        .tag-bg { fill: #1e3a8a; stroke: #3b82f6; }
        .edge-tag { fill: #bfdbfe; }
        .ocm-pill { fill: #0f172a; stroke: #334155; }
      }
    </style>
  </defs>

  <!-- Background Frame -->
  <rect width="880" height="340" rx="16" fill="url(#ocm-bg-gradient)"/>
  <rect width="878" height="338" x="1" y="1" rx="15" stroke="#cbd5e1" stroke-opacity="0.4" fill="none"/>

  <!-- Top Banner Pill -->
  <g transform="translate(28, 14)">
    <rect width="610" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="15" cy="13" r="5" fill="#f59e0b"/>
    <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#003366">ORGANIZATIONAL CHANGE MANAGEMENT: OCM, CONTACT CENTRE &amp; SERVICE BC CENTRES</text>
  </g>

  <!-- Left Column: Partner Programs -->
  <g transform="translate(30, 48)">
    <rect class="ocm-card" width="240" height="278"/>
    <rect x="12" y="10" width="28" height="28" rx="6" fill="#eff6ff"/>
    <!-- Users / Team icon -->
    <path d="M 22 20 A 4 4 0 1 1 22 28 A 4 4 0 1 1 22 20 M 30 18 A 3 3 0 1 1 30 24 A 3 3 0 1 1 30 18 M 16 32 C 16 29 20 28 22 28 C 24 28 28 29 28 32 M 28 29 C 30 29 33 30 33 32" stroke="#2563eb" stroke-width="1.6" fill="none"/>
    <text class="ocm-title" x="46" y="22">Partner Programs</text>
    <text class="ocm-sub" x="46" y="34">Digital Product Teams</text>

    <line x1="12" y1="44" x2="228" y2="44" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Program 1: Registries & Policy Initiatives -->
    <g transform="translate(10, 50)">
      <rect class="ocm-pill" width="220" height="52"/>
      <rect x="8" y="8" width="6" height="36" rx="3" fill="#0284c7"/>
      <text x="20" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369a1">Digital Product Squads</text>
      <text x="20" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Business Registries, STRR, Pay, Auth</text>
      <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• New ministry legislative rollouts</text>
    </g>

    <!-- Program 2: Stakeholder Needs -->
    <g transform="translate(10, 108)">
      <rect class="ocm-pill" width="220" height="52"/>
      <rect x="8" y="8" width="6" height="36" rx="3" fill="#10b981"/>
      <text x="20" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857">Change Requirements</text>
      <text x="20" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Business process transformations</text>
      <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Policy changes &amp; fee structure updates</text>
    </g>

    <!-- Program 3: Citizen Experience Goals -->
    <g transform="translate(10, 166)">
      <rect class="ocm-pill" width="220" height="52"/>
      <rect x="8" y="8" width="6" height="36" rx="3" fill="#8b5cf6"/>
      <text x="20" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#6d28d9">Omnichannel Alignment</text>
      <text x="20" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Seamless digital-to-counter handoffs</text>
      <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748b">• Accessible in-person assistance</text>
    </g>

    <!-- Input 4: Standard Ingestion Tag -->
    <g transform="translate(10, 224)">
      <rect width="220" height="30" rx="6" fill="#f1f5f9"/>
      <text x="12" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#334155">🤝 Collaborative OCM Partnership</text>
    </g>
  </g>

  <!-- Arrow 1: Programs -> OCM Hub -->
  <path d="M 270 185 L 315 185" class="edge-solid"/>
  <g transform="translate(272, 165)">
    <rect class="tag-bg" width="42" height="18" x="-2" y="-9"/>
    <text class="edge-tag" x="19" y="4" text-anchor="middle">enable</text>
  </g>

  <!-- Center Card: OCM Core Hub -->
  <g transform="translate(315, 48)">
    <rect width="270" height="278" rx="12" fill="#003366" filter="url(#ocm-shadow)"/>
    
    <!-- Header Box -->
    <rect x="12" y="10" width="246" height="34" rx="6" fill="#002244"/>
    <circle cx="28" cy="27" r="8" fill="#f59e0b"/>
    <!-- Compass / Process icon -->
    <path d="M 28 19 L 32 25 L 26 27 L 24 21 Z M 28 27 A 8 8 0 1 1 28 19" stroke="#ffffff" stroke-width="1.6" fill="none"/>
    <text x="44" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">OCM Core Practice</text>
    <text x="44" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#93c5fd">Operational Readiness &amp; Enablement</text>

    <!-- Block 1: Readiness & Strategy -->
    <g transform="translate(12, 50)">
      <rect width="246" height="66" rx="6" fill="#0f3c6d"/>
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#67e8f9">📋 READINESS &amp; IMPACT ASSESSMENT</text>
      <text x="10" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Stakeholder mapping &amp; change plans</text>
      <text x="10" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Risk mitigation &amp; communication kits</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#93c5fd">Structured Prosci / ADKAR framework</text>
    </g>

    <!-- Block 2: Training & SOPs -->
    <g transform="translate(12, 122)">
      <rect width="246" height="64" rx="6" fill="#0f3c6d"/>
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fde047">🎓 FRONTLINE TRAINING &amp; SOPS</text>
      <text x="10" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Agent job aids &amp; escalation trees</text>
      <text x="10" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Knowledge base articles &amp; call scripts</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#86efac">Tier 1 / Tier 2 agent readiness</text>
    </g>

    <!-- Block 3: Continuous Feedback -->
    <g transform="translate(12, 192)">
      <rect width="246" height="74" rx="6" fill="#0369a1"/>
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#e0f2fe">🔄 CITIZEN &amp; STAFF FEEDBACK LOOPS</text>
      <text x="10" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Contact centre call volume analytics</text>
      <text x="10" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#ffffff">• Counter staff feedback back to squads</text>
      <text x="10" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#fde047">Iterative product UX improvements</text>
    </g>
  </g>

  <!-- Arrow 2: OCM Hub -> Frontline Delivery -->
  <path d="M 585 185 L 635 185" class="edge-solid"/>
  <g transform="translate(588, 165)">
    <rect class="tag-bg" width="44" height="18" x="-2" y="-9"/>
    <text class="edge-tag" x="20" y="4" text-anchor="middle">deploy</text>
  </g>

  <!-- Right Column: Frontline Delivery Network -->
  <g transform="translate(635, 48)">
    <rect class="ocm-card" width="215" height="278"/>
    <rect x="12" y="10" width="28" height="28" rx="6" fill="#f0fdf4"/>
    <!-- Headset & Building icon -->
    <path d="M 20 25 C 20 20 23 16 28 16 C 33 16 36 20 36 25 M 19 25 A 3 3 0 0 1 19 31 M 37 25 A 3 3 0 0 1 37 31 M 34 31 L 28 33" stroke="#16a34a" stroke-width="1.6" fill="none"/>
    <text class="ocm-title" x="46" y="22">Delivery Network</text>
    <text class="ocm-sub" x="46" y="34">Province-Wide Reach</text>

    <line x1="12" y1="44" x2="203" y2="44" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Output Card 1: Contact Centre -->
    <g transform="translate(10, 52)">
      <rect width="195" height="96" rx="8" fill="#f0fdf4" stroke="#dcfce7" stroke-width="1.2"/>
      <text x="10" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#166534">📞 Service BC Contact Centre</text>
      <text x="10" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532d">• Omnichannel phone, chat &amp; email</text>
      <text x="10" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532d">• Multi-lingual citizen support</text>
      <text x="10" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532d">• Specialized Tier 1/2 registry agents</text>
      <text x="10" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#15803d">High first-contact resolution</text>
    </g>

    <!-- Output Card 2: 65+ In-Person Centres -->
    <g transform="translate(10, 156)">
      <rect width="195" height="110" rx="8" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.2"/>
      <text x="10" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">🏛️ 65+ Service BC Centres</text>
      <text x="10" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#1e3a8a">• In-person physical service network</text>
      <text x="10" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#1e3a8a">• Identity verification &amp; ID checks</text>
      <text x="10" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#1e3a8a">• Counter payment &amp; assisted filing</text>
      <text x="10" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#2563eb">Urban, rural &amp; remote access</text>
      <text x="10" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#1e40af">Universal equitable delivery</text>
    </g>
  </g>
</svg>
