# Lefthook Git hooks configuration for Nuxt implementation
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    secret-scan:
      tags: security
      run: node scripts/run-gitleaks.mjs
    lint:
      glob: "*.{js,ts,jsx,tsx,vue}"
      run: pnpm run lint
    typecheck:
      glob: "*.{js,ts,vue}"
      run: pnpm run typecheck
